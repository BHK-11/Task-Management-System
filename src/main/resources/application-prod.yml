spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  thymeleaf:
    cache: true
  jpa:
    show-sql: false

server:
  servlet:
    session:
      cookie:
        secure: true
  error:
    include-exception: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
