<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/workspace :: layout(~{::title}, ~{::main})}">
<head><title>Automation approvals — TASK OS</title></head>
<body><main id="main-content" class="workspace-content automation-page"><header class="automation-hero"><div><p class="eyebrow">TEAM WORKSPACE · APPROVAL GATE</p><h1>Workflow approvals</h1><p>Review the rule and its ordered actions before approving a pending execution.</p></div><a class="button button-secondary" th:href="@{/automations(scopeType='WORKSPACE',scopeId=${scopeId})}">Back to rules</a></header>
    <div class="automation-flash" role="status" th:if="${automationMessage}" th:text="${automationMessage}"></div><section class="automation-section"><div class="automation-section-heading"><div><p class="eyebrow eyebrow-muted">PENDING DECISIONS</p><h2>Needs review</h2></div></div>
        <article class="approval-card" th:each="approval : ${approvals}"><div><span class="automation-status status-waiting_approval">PENDING APPROVAL</span><h3 th:text="${approval.ruleName}">Rule name</h3><p class="approval-description" th:text="${approval.ruleDescription}">Description</p><ol class="approval-action-list"><li th:each="action : ${approval.actions}" th:text="${action}">Action</li></ol><small th:text="${'Requested ' + #temporals.format(approval.request.createdAt, 'MMM d · h:mm a') + ' · Expires ' + #temporals.format(approval.request.expiresAt, 'MMM d · h:mm a')}">Expires</small></div><form method="post" th:action="@{/automations/approvals/{id}/decision(id=${approval.request.id})}" class="approval-decision-form"><input type="hidden" name="workspaceId" th:value="${scopeId}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="sr-only" th:for="${'decision-reason-' + approval.request.id}">Optional decision note</label><input th:id="${'decision-reason-' + approval.request.id}" name="reason" maxlength="240" placeholder="Optional note"><div><button class="button button-primary" name="approve" value="true" type="submit">Approve workflow</button><button class="button button-secondary" name="approve" value="false" type="submit">Reject</button></div></form></article>
        <div class="automation-empty" th:if="${#lists.isEmpty(approvals)}"><span class="automation-empty-icon" aria-hidden="true">✓</span><h3>All clear</h3><p>No workspace workflows need approval.</p></div>
    </section>
</main></body></html>
