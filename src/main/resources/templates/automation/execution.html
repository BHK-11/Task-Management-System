<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/workspace :: layout(~{::title}, ~{::main})}">
<head><title>Workflow run — TASK OS</title></head>
<body><main id="main-content" class="workspace-content automation-page"><div class="automation-flash" role="status" th:if="${automationMessage}" th:text="${automationMessage}"></div><p class="eyebrow"><a th:href="@{/automations(scopeType=${scopeType},scopeId=${scopeId})}">AUTOMATIONS</a> / RUN HISTORY</p><header class="automation-hero"><div><p class="eyebrow">EXECUTION DETAILS</p><h1>Workflow run</h1><p>Every action and retry is recorded against the rule version that started this run.</p></div><div><span class="automation-status" th:classappend="${' status-' + #strings.toLowerCase(execution.status.name())}" th:text="${#strings.replace(execution.status.name(), '_', ' ')}">PENDING</span><form th:if="${execution.status.name() == 'DEAD_LETTER' or execution.status.name() == 'FAILED_RETRYABLE'}" method="post" th:action="@{/automations/executions/{id}/retry(id=${execution.id})}"><input type="hidden" name="scopeType" th:value="${scopeType}"><input type="hidden" name="scopeId" th:value="${scopeId}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button button-primary button-small" type="submit">Retry run</button></form></div></header>
    <section class="automation-detail-grid"><article class="automation-detail-card"><small>Execution</small><strong th:text="${execution.id}">id</strong></article><article class="automation-detail-card"><small>Rule</small><strong th:text="${execution.ruleId}">id</strong></article><article class="automation-detail-card"><small>Rule version</small><strong th:text="${execution.ruleVersionId}">id</strong></article><article class="automation-detail-card"><small>Correlation</small><strong th:text="${execution.correlationId}">id</strong></article></section>
    <section class="automation-section"><div class="automation-section-heading"><div><p class="eyebrow eyebrow-muted">STEP HISTORY</p><h2>Actions in order</h2></div></div><ol class="execution-step-list"><li th:each="step : ${steps}"><span class="execution-step-number" th:text="${step.stepIndex + 1}">1</span><div><strong th:text="${#strings.replace(step.actionType.name(), '_', ' ')}">CREATE TASK</strong><small th:text="${step.resultSummary != null ? step.resultSummary : (step.errorCode != null ? step.errorCode : step.status)}">Pending</small></div><span class="automation-status" th:classappend="${' status-' + #strings.toLowerCase(step.status.name())}" th:text="${#strings.replace(step.status.name(), '_', ' ')}">PENDING</span></li></ol>
    </section>
</main></body></html>
