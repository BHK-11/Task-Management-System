<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/workspace :: layout(~{::title}, ~{::main})}">
<head><title>Goal roadmap — TASK OS</title></head>
<body><main id="main-content" class="workspace-content growth-page">
    <div class="task-flash" role="status" th:if="${taskMessage}" th:text="${taskMessage}"></div><div class="task-flash task-flash-error" role="alert" th:if="${taskError}" th:text="${taskError}"></div>
    <header class="growth-heading"><div><p class="eyebrow">GOAL ROADMAP</p><h1 th:text="${goalDetail.goal.title}">Goal</h1><p>Milestones show real checkpoints and completion states.</p></div><a class="button button-light" th:href="@{/goals/{id}(id=${goalDetail.goal.id})}">Back to goal</a></header>
    <section class="growth-panel"><div class="growth-timeline">
        <article class="growth-timeline-item"><span class="growth-timeline-marker">S</span><div><p class="eyebrow">START</p><h2>Begin the work</h2><time th:text="${#temporals.format(goalDetail.goal.startDate, 'MMMM d, yyyy')}">Start date</time></div></article>
        <article class="growth-timeline-item" th:each="milestone, iter : ${goalDetail.milestones}"><span class="growth-timeline-marker" th:classappend="${milestone.status == 'COMPLETED' ? 'done' : ''}" th:text="${milestone.status == 'COMPLETED' ? '✓' : '•'}">•</span><div><p class="eyebrow" th:text="${milestone.status == 'COMPLETED' ? 'COMPLETED CHECKPOINT' : 'MILESTONE'}">Milestone</p><h2 th:text="${milestone.title}">Checkpoint</h2><p th:if="${milestone.description != ''}" th:text="${milestone.description}">Details</p><time th:if="${milestone.targetDate != null}" th:text="${#temporals.format(milestone.targetDate, 'MMMM d, yyyy')}">Target date</time>
            <div class="growth-milestone-actions"><form method="post" th:action="@{/goals/{id}/milestones/{milestoneId}/toggle(id=${goalDetail.goal.id},milestoneId=${milestone.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="text-button" type="submit" th:text="${milestone.status == 'COMPLETED' ? 'Reopen checkpoint' : 'Mark complete'}">Mark complete</button></form><form method="post" th:action="@{/goals/{id}/milestones/{milestoneId}/move(id=${goalDetail.goal.id},milestoneId=${milestone.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="direction" value="-1"><button class="text-button" type="submit" th:disabled="${iter.first}" aria-label="Move milestone earlier">↑ Earlier</button></form><form method="post" th:action="@{/goals/{id}/milestones/{milestoneId}/move(id=${goalDetail.goal.id},milestoneId=${milestone.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="direction" value="1"><button class="text-button" type="submit" th:disabled="${iter.last}" aria-label="Move milestone later">↓ Later</button></form><form method="post" th:action="@{/goals/{id}/milestones/{milestoneId}/delete(id=${goalDetail.goal.id},milestoneId=${milestone.id})}" onsubmit="return confirm('Remove this milestone from the roadmap?')"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="text-button text-danger" type="submit">Delete</button></form></div>
            <details class="growth-details"><summary>Edit milestone</summary><form class="growth-inline-form growth-edit-form" method="post" th:action="@{/goals/{id}/milestones/{milestoneId}(id=${goalDetail.goal.id},milestoneId=${milestone.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="form-field"><label th:for="${'milestone-title-' + milestone.id}">Title</label><input th:id="${'milestone-title-' + milestone.id}" type="text" name="title" maxlength="160" th:value="${milestone.title}" required></div><div class="form-field"><label th:for="${'milestone-date-' + milestone.id}">Target date</label><input th:id="${'milestone-date-' + milestone.id}" type="date" name="targetDate" th:value="${milestone.targetDate}"></div><div class="form-field growth-form-wide"><label th:for="${'milestone-description-' + milestone.id}">Description</label><input th:id="${'milestone-description-' + milestone.id}" type="text" name="description" maxlength="1000" th:value="${milestone.description}"></div><button class="button button-light" type="submit">Save milestone</button></form></details>
        </div></article>
        <article class="growth-timeline-item"><span class="growth-timeline-marker target">◎</span><div><p class="eyebrow">TARGET</p><h2 th:text="${goalDetail.goal.targetDate == null ? 'Choose a target date' : 'Reach your outcome'}">Target</h2><time th:if="${goalDetail.goal.targetDate != null}" th:text="${#temporals.format(goalDetail.goal.targetDate, 'MMMM d, yyyy')}">Target date</time></div></article>
    </div></section>
    <section class="growth-panel"><div class="growth-panel-heading"><span aria-hidden="true">＋</span><div><h2>Add a checkpoint</h2><p>Keep dates and completion states tied to real milestones.</p></div></div><form class="growth-inline-form" method="post" th:action="@{/goals/{id}/milestones(id=${goalDetail.goal.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="form-field"><label for="milestone-title">Milestone</label><input id="milestone-title" type="text" name="title" maxlength="160" required></div><div class="form-field"><label for="milestone-date">Target date <span class="muted-text">(optional)</span></label><input id="milestone-date" type="date" name="targetDate"></div><div class="form-field growth-form-wide"><label for="milestone-description">Description <span class="muted-text">(optional)</span></label><input id="milestone-description" type="text" name="description" maxlength="1000"></div><button class="button button-primary" type="submit">Add milestone</button></form></section>
</main></body></html>
