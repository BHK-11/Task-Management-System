<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/workspace :: layout(~{::title}, ~{::main})}">
<head><title>Focus History — TASK OS</title></head>
<body><main id="main-content" class="workspace-content time-page"><header class="time-heading"><div><p class="eyebrow">RECORDED SESSIONS</p><h1>Focus history</h1><p>Sessions are recorded when you finish or stop them.</p></div><a class="button button-primary" th:href="@{/focus/pomodoro}">Start focus</a></header>
    <section class="time-panel" aria-labelledby="focus-history-title"><div class="time-panel-heading"><div><p class="eyebrow eyebrow-muted">MOST RECENT</p><h2 id="focus-history-title">Your sessions</h2></div></div>
        <div class="time-table-wrap"><table class="time-table"><thead><tr><th>Task</th><th>Mode</th><th>Started</th><th>Ended</th><th>Focus time</th><th>Break time</th><th>Status</th></tr></thead><tbody><tr th:each="session : ${focusHistory}"><td th:text="${taskTitles.getOrDefault(session.taskId, session.taskId == null ? 'Personal focus' : 'Deleted task')}">Task</td><td th:text="${session.mode == T(com.taskos.time.entity.FocusMode).POMODORO ? 'Pomodoro' : 'Deep Work'}">Pomodoro</td><td><time th:datetime="${session.startedAt}" th:text="${#temporals.format(session.startedAt, 'MMM d · h:mm a')}">Oct 20</time></td><td th:text="${session.completedAt != null ? #temporals.format(session.completedAt, 'MMM d · h:mm a') : 'In progress'}">—</td><td th:text="${#numbers.formatDecimal(session.focusSeconds / 60.0, 1, 0)} + ' min'">25 min</td><td th:text="${#numbers.formatDecimal(session.breakSeconds / 60.0, 1, 0)} + ' min'">5 min</td><td><span class="time-status" th:text="${session.state}">COMPLETED</span></td></tr><tr th:if="${#lists.isEmpty(focusHistory)}"><td colspan="7" class="time-empty">No focus sessions have been recorded yet.</td></tr></tbody></table></div>
    </section></main></body></html>
