<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/workspace :: layout(~{::title}, ~{::main})}">
<head><title th:text="${pageTitle}">Workspace invitation — TASK OS</title></head>
<body><main id="main-content" class="workspace-content team-page">
    <section class="project-panel team-invitation-card">
        <p class="eyebrow">WORKSPACE INVITATION</p><h1>Join <span th:text="${invite.workspaceName}">Workspace</span></h1>
        <p>You were invited as <strong th:text="${invite.role}">MEMBER</strong>. This invite is tied to your signed-in account email and expires <time th:text="${#temporals.format(invite.expiresAt, 'MMM d, yyyy')}">soon</time>.</p>
        <div class="team-invitation-actions">
            <form method="post" th:action="@{/invitations/{token}/accept(token=${token})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button button-primary" type="submit">Accept invitation</button></form>
            <form method="post" th:action="@{/invitations/{token}/decline(token=${token})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button button-quiet" type="submit">Decline</button></form>
        </div>
        <p class="team-private-note">Workspace access does not include your personal projects, tasks, goals, habits or time history.</p>
    </section>
</main></body></html>
