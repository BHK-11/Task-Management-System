<header class="public-header" xmlns:th="http://www.thymeleaf.org" th:fragment="header">
    <div class="public-header-inner">
        <a class="brand" th:href="@{/}" aria-label="TASK OS home">
            <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M18 2.8 32 10.9v14.2L18 33.2 4 25.1V10.9L18 2.8Z"/><path d="m11.1 18.2 4.4 4.3 9.7-10"/></svg></span>
            <span class="brand-copy"><strong>TASK<span> OS</span></strong><small>Work, with intention</small></span>
        </a>
        <nav class="public-nav" aria-label="Main navigation">
            <a th:href="@{/about}">About</a>
            <a th:href="@{/roadmap}">Roadmap</a>
            <a th:if="${currentUser == null}" th:href="@{/preview}"><span class="nav-label-wide">Explore preview</span><span class="nav-label-compact">Preview</span></a>
            <a th:if="${currentUser != null}" th:href="@{/app}">Workspace</a>
            <a th:if="${currentUser == null}" th:href="@{/login}">Sign in</a>
            <a th:if="${currentUser == null}" class="nav-cta" th:href="@{/signup}"><span class="nav-label-wide">Create account</span><span class="nav-label-compact">Sign up</span><span aria-hidden="true">↗</span></a>
            <a th:if="${currentUser != null}" class="nav-account" th:href="@{/profile}" th:text="${currentUser.displayName}">Account</a>
            <form th:if="${currentUser != null}" class="nav-logout-form" th:action="@{/logout}" method="post">
                <button type="submit" class="nav-logout">Sign out</button>
            </form>
        </nav>
        <label th:if="${currentUser == null}" class="theme-control public-theme"><span class="theme-icon" aria-hidden="true">◐</span><span class="sr-only">Color theme</span><select data-theme-select aria-label="Color theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    </div>
</header>
