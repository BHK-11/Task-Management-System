<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/workspace :: layout(~{::title}, ~{::main})}">
<head><title th:text="${reviewWorkspace.review.type == T(com.taskos.goals.entity.ReviewType).WEEKLY ? 'Weekly review' : 'Monthly review'} + ' — TASK OS'">Review — TASK OS</title></head>
<body><main id="main-content" class="workspace-content growth-page">
    <div class="task-flash" role="status" th:if="${taskMessage}" th:text="${taskMessage}"></div><div class="task-flash task-flash-error" role="alert" th:if="${taskError}" th:text="${taskError}"></div>
    <header class="growth-heading"><div><p class="eyebrow" th:text="${reviewWorkspace.review.type == T(com.taskos.goals.entity.ReviewType).WEEKLY ? 'WEEKLY REFLECTION' : 'MONTHLY REFLECTION'}">Review</p><h1 th:text="${reviewWorkspace.review.type == T(com.taskos.goals.entity.ReviewType).WEEKLY ? 'Review your week' : 'Review your month'}">Review period</h1><p th:text="${#temporals.format(reviewWorkspace.review.periodStart, 'MMM d, yyyy') + ' – ' + #temporals.format(reviewWorkspace.review.periodEnd, 'MMM d, yyyy')}">Dates</p></div><a class="button button-light" th:href="@{/reviews/history}">Review history</a></header>
    <section class="growth-metrics review-metrics"><article class="growth-metric"><span>Completed tasks</span><strong th:text="${reviewWorkspace.completedTasks}">0</strong><small>From saved task completion times</small></article><article class="growth-metric"><span>Habit check-ins</span><strong th:text="${reviewWorkspace.habitCheckIns}">0</strong><small>User-recorded performed check-ins</small></article><article class="growth-metric"><span>Goal / key result check-ins</span><strong th:text="${reviewWorkspace.goalCheckIns + reviewWorkspace.keyResultCheckIns}">0</strong><small>Measurement records in this period</small></article><article class="growth-metric"><span>Tracked focus</span><strong th:text="${T(java.time.Duration).ofSeconds(reviewWorkspace.focusSeconds).toHours() + 'h ' + (T(java.time.Duration).ofSeconds(reviewWorkspace.focusSeconds).toMinutesPart()) + 'm'}">0h 0m</strong><small>Completed time entries only</small></article></section>
    <form class="growth-form growth-panel" method="post" th:action="${reviewAction}" th:object="${reviewWorkspace.form}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="period" th:value="${reviewWorkspace.review.periodStart}"><div class="growth-form-grid"><div class="form-field growth-form-wide"><label for="review-wins">What went well? <span class="muted-text">(your reflection)</span></label><textarea id="review-wins" rows="3" maxlength="2000" th:field="*{wins}" placeholder="Add your own wins."></textarea></div><div class="form-field growth-form-wide"><label for="review-challenges">What felt difficult or needs adjustment?</label><textarea id="review-challenges" rows="3" maxlength="2000" th:field="*{challenges}" placeholder="Record your own observations."></textarea></div><div class="form-field growth-form-wide"><label for="review-next">What will you focus on next?</label><textarea id="review-next" rows="3" maxlength="2000" th:field="*{nextSteps}" placeholder="Write the priorities you choose."></textarea></div><div class="form-field growth-form-wide"><label for="review-reflection">Personal reflection</label><textarea id="review-reflection" rows="5" maxlength="3000" th:field="*{reflection}" placeholder="Use your own words. TASK OS will not invent reasons for your progress."></textarea></div></div><div class="growth-review-status"><span class="growth-status" th:text="${reviewWorkspace.review.status}">DRAFT</span><time th:if="${reviewWorkspace.review.completedAt != null}" th:text="${'Completed ' + #temporals.format(reviewWorkspace.review.completedAt, 'MMM d, yyyy h:mm a')}">Completed at</time></div><div class="growth-actions"><button class="button button-light" type="submit" name="complete" value="false">Save draft</button><button class="button button-primary" type="submit" name="complete" value="true">Complete review</button></div></form>
</main></body></html>
