<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/workspace :: layout(~{::title}, ~{::main})}">
<head><title>Review history — TASK OS</title></head>
<body><main id="main-content" class="workspace-content growth-page">
    <header class="growth-heading"><div><p class="eyebrow">PERSONAL REVIEW ARCHIVE</p><h1>Review history</h1><p>Drafts and completed reviews remain available for future reflection.</p></div><div class="growth-heading-actions"><a class="button button-light" th:href="@{/reviews/weekly}">Weekly review</a><a class="button button-light" th:href="@{/reviews/monthly}">Monthly review</a></div></header>
    <section class="growth-panel"><div class="growth-table-wrap"><table class="growth-table"><thead><tr><th scope="col">Period</th><th scope="col">Dates</th><th scope="col">Status</th><th scope="col">Saved</th><th scope="col"></th></tr></thead><tbody><tr th:each="review : ${reviews}"><th scope="row" th:text="${#strings.capitalize(#strings.toLowerCase(review.type))}">Weekly</th><td th:text="${#temporals.format(review.periodStart, 'MMM d, yyyy') + ' – ' + #temporals.format(review.periodEnd, 'MMM d, yyyy')}">Dates</td><td th:text="${#strings.capitalize(#strings.toLowerCase(review.status))}">Draft</td><td th:text="${review.completedAt == null ? #temporals.format(review.updatedAt, 'MMM d, yyyy') : #temporals.format(review.completedAt, 'MMM d, yyyy')}">Date</td><td><a class="text-link" th:href="@{/reviews/{id}(id=${review.id})}">Open review →</a></td></tr></tbody></table></div><p class="growth-empty growth-empty-compact" th:if="${#lists.isEmpty(reviews)}">Your saved reviews will appear here.</p></section>
</main></body></html>
