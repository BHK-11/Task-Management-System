<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/workspace :: layout(~{::title}, ~{::main})}">
<head><title>Create objective — TASK OS</title></head>
<body><main id="main-content" class="workspace-content growth-page">
    <div class="task-flash task-flash-error" role="alert" th:if="${taskError}" th:text="${taskError}"></div><header class="growth-heading"><div><p class="eyebrow">PERSONAL OKR</p><h1>Create an objective</h1><p>Objectives describe outcomes; key results carry the measurable values.</p></div><a class="button button-quiet" th:href="@{/okrs}">Cancel</a></header>
    <form class="growth-form growth-panel" method="post" th:action="@{/okrs}" th:object="${okrForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="growth-panel-heading"><span>01</span><div><h2>Outcome</h2><p>Add real key results after you create the objective.</p></div></div><div class="growth-form-grid"><div class="form-field growth-form-wide"><label for="objective-title">Objective title</label><input id="objective-title" type="text" maxlength="160" th:field="*{title}" placeholder="Build confidence with Java backend development" required></div><div class="form-field growth-form-wide"><label for="objective-description">Description <span class="muted-text">(optional)</span></label><textarea id="objective-description" rows="3" maxlength="1200" th:field="*{description}"></textarea></div><div class="form-field"><label for="cycle-name">Review cycle name</label><input id="cycle-name" type="text" maxlength="100" th:field="*{cycleName}" placeholder="Q4 2026" required></div><div class="form-field"><label for="linked-goal">Linked SMART goal <span class="muted-text">(optional)</span></label><select id="linked-goal" th:field="*{linkedGoalId}"><option value="">No linked goal</option><option th:each="goal : ${goals}" th:value="${goal.id}" th:text="${goal.title}">Goal</option></select></div><div class="form-field"><label for="cycle-start">Cycle starts</label><input id="cycle-start" type="date" th:field="*{cycleStart}" required></div><div class="form-field"><label for="cycle-end">Cycle ends</label><input id="cycle-end" type="date" th:field="*{cycleEnd}" required></div></div><div class="growth-actions"><button class="button button-primary" type="submit">Create objective</button><a class="button button-quiet" th:href="@{/okrs}">Cancel</a></div></form>
</main></body></html>
