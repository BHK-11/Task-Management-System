spring:
  application:
    name: TASK OS
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskos}
    username: ${DB_USERNAME:taskos}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: task_os
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  task:
    scheduling:
      pool:
        size: 2

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    info:
      enabled: true

logging:
  level:
    com.taskos: INFO
    org.flywaydb: INFO

taskos:
  ai:
    service-url: ${TASKOS_AI_SERVICE_URL:}
    service-token: ${TASKOS_AI_SERVICE_TOKEN:}
    execution:
      enabled: ${TASKOS_AI_EXECUTION_ENABLED:true}
    artifact-directory: ${TASKOS_ARTIFACT_DIRECTORY:${user.home}/.taskos/artifacts}
  browser:
    service-url: ${TASKOS_BROWSER_SERVICE_URL:}
    service-token: ${TASKOS_BROWSER_SERVICE_TOKEN:}
